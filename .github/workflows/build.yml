# Builds the site and publishes dist/ to the "deploy" branch.
# The o2switch server pulls that branch with deploy/pull.sh (cron), so this workflow
# never touches the server and needs no SSH key and no secret beyond the default GITHUB_TOKEN.
# It runs on every push to main and every three hours at minute 5 (the repository is private,
# so this keeps well inside the free Actions minutes), so a page goes live at most three hours
# after its publish time.
name: Build and publish to the deploy branch

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Restore the image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**', 'src/lib/images.mjs', 'package-lock.json') }}
          restore-keys: astro-assets-

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (publish gate in New York time)
        run: npm run build

      - name: Push dist to the deploy branch when it changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}, $(date -u +%Y-%m-%dT%H:%MZ)"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 "$REMOTE" deploy 2>/dev/null && [ "$(git rev-parse FETCH_HEAD^{tree})" = "$(git rev-parse HEAD^{tree})" ]; then
            echo "dist is unchanged, nothing to publish"
            exit 0
          fi
          git push -q --force "$REMOTE" HEAD:deploy
          echo "deploy branch updated"
